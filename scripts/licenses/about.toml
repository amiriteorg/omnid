# cargo-about's settings for scripts/third-party-notices.py. Where a crate offers a choice,
# the first license here that it offers is the one its notice is shipped under.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
    "MPL-2.0",
    "CC0-1.0",
    "MIT-0",
    "Unlicense",
    "BSL-1.0",
    "OpenSSL",
]
# Build scripts and dev-dependencies are not shipped.
ignore-build-dependencies = true
ignore-dev-dependencies = true
