# The fast gate (.agents/engineering.json) on GitHub's runners, for every pull
# request and every push to main, plus rustdoc, the Android app's JVM unit
# tests, the release's license check, the security scanners and a minute of
# each fuzz target. Live tests stay off: they need real routers. Actions are
# pinned to commits.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust (fmt, clippy, tests, docs)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - run: cargo test --workspace --locked
      - run: cargo doc --workspace --no-deps --locked
        env:
          RUSTDOCFLAGS: -D warnings

  android:
    name: Android unit tests, licenses
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "17"
      # Also checks the Gradle wrapper against Gradle's published checksums.
      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
      - run: ./gradlew --no-daemon testDebugUnitTest
        working-directory: android
      # The release's license check (docs/releasing.md), on every pull request:
      # a dependency under a license scripts/licenses/about.toml does not
      # accept, or a Java library under one the script does not know, fails
      # here instead of stopping the release. It needs Gradle for the app's
      # Java libraries, so it runs in this job; the notices it writes are
      # thrown away.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          cache-targets: false
      - run: cargo install --locked --features cli cargo-about@0.9.3
      - name: Third-party licenses
        run: |
          set -euo pipefail
          scripts/third-party-notices.py macos "$RUNNER_TEMP/notices/macos.txt"
          scripts/third-party-notices.py android "$RUNNER_TEMP/notices/android.txt"

  security:
    name: Security scanners
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          cache: false
      # The versions the release gate runs with. go install checks each module
      # against Go's checksum database.
      - name: Install the scanners
        run: |
          set -euo pipefail
          python -m pip install --disable-pip-version-check semgrep==1.185.0
          go install github.com/zricethezav/gitleaks/v8@v8.30.1
          go install github.com/google/osv-scanner/v2/cmd/osv-scanner@v2.7.1
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12
          echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
      - run: ./.agents/bin/eng audit-actions
      # Every scanner must pass, the optional ones too: eng lets an optional
      # scanner's error through, which here would be a silent pass.
      - name: Scan
        run: |
          set -euo pipefail
          ./.agents/bin/eng security --require | tee "$RUNNER_TEMP/security.txt"
          if grep -vE '^(ok |artifacts:)' "$RUNNER_TEMP/security.txt"; then
            echo "a scanner did not pass" >&2
            exit 1
          fi

  fuzz:
    name: Fuzz targets (60 s each)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The versions that ship; cargo adds only the fuzzing crates.
      - run: cp Cargo.lock fuzz/Cargo.lock
      # cargo-fuzz needs nightly. A dated one, so a new nightly cannot break CI;
      # move it forward by hand.
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          toolchain: nightly-2026-11-01
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: fuzz
      - run: cargo install --locked cargo-fuzz@0.13.2
      - run: cargo fuzz build
        working-directory: fuzz
      # A crash, a leak, an input that takes over 10 s or running out of memory
      # fails the job. libFuzzer prints the input; `cargo fuzz run <target>
      # <file>` replays it.
      - name: Run each target for 60 s
        working-directory: fuzz
        run: |
          set -euo pipefail
          # Assigned first, so a failing `cargo fuzz list` fails the step
          # instead of running nothing.
          targets=$(cargo fuzz list)
          test -n "$targets"
          for target in $targets; do
            mkdir -p "corpus/$target"
            dict=""
            if [ -f "dicts/$target.dict" ]; then dict="-dict=dicts/$target.dict"; fi
            cargo fuzz run "$target" "corpus/$target" "seeds/$target" -- \
              -max_total_time=60 -timeout=10 ${dict:+"$dict"}
          done
